plugins {
    id 'com.android.application' version '8.9.3'
}
android {
    namespace 'dev.discordru'
    compileSdk 35
    defaultConfig {
        minSdk 24
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
    }
    androidResources {
        additionalParameters '--allow-reserved-package-id', '--package-id', '0x78'
    }
    buildFeatures {
        buildConfig = false
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles 'payload.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}
