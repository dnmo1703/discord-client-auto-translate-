plugins {
    id 'com.android.application' version '8.9.3'
}
android {
    namespace 'dev.discordru'
    compileSdk 35
    defaultConfig {
        minSdk 24
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
    }
    androidResources {
        additionalParameters '--allow-reserved-package-id', '--package-id', '0x78'
    }
    sourceSets.main.jniLibs.srcDirs += [layout.buildDirectory.dir("generated/rustJniLibs")]
    sourceSets.main.assets.srcDirs += [layout.buildDirectory.dir("generated/settingsAssets")]
    buildFeatures {
        buildConfig = false
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles 'payload.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
