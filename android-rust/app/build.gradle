plugins { id 'com.android.application' version '8.7.3' }

def rustLibs = layout.buildDirectory.dir('generated/rustJniLibs')
def sharedJava = layout.buildDirectory.dir('generated/sharedJava')

android {
    namespace 'dev.discordru.android'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.discordru.nativeclient'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.java.srcDir(sharedJava)
    sourceSets.main.jniLibs.srcDir(rustLibs)
    buildTypes {
        release { minifyEnabled false }
    }
}

def syncSharedJava = tasks.register('syncSharedJava', Sync) {
    from('../../discord-ru/app/src/main/java') {
        include 'dev/discordru/LoopbackProxy.java', 'dev/discordru/ProxySettings.java'
    }
    into(sharedJava)
}

def buildRust = tasks.register('buildRust', Exec) {
    def shared = rootProject.file('../discord-ru')
    inputs.files(fileTree(new File(shared, 'native')) { exclude 'target/**' })
    inputs.files(new File(shared, 'tools/build-native.sh'), new File(shared, 'rust-toolchain.toml'))
    outputs.dir(rustLibs)
    commandLine new File(shared, 'tools/build-native.sh'), layout.buildDirectory.get().asFile
}
tasks.named('preBuild').configure { dependsOn(syncSharedJava, buildRust) }
