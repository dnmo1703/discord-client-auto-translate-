name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      XRAY_LIB_VERSION: v26.11.9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download xray core (AndroidLibXrayLite)
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${XRAY_LIB_VERSION}/libv2ray.aar"
          ls -la app/libs

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk DCProxy.apk
          ls -la DCProxy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DCProxy
          path: DCProxy.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest DCProxy.apk \
            --title "DC Proxy (сборка ${GITHUB_RUN_NUMBER})" \
            --notes "Автосборка из коммита ${GITHUB_SHA::7}. Скачайте DCProxy.apk ниже." \
            --target "${GITHUB_SHA}"
