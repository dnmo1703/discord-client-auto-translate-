name: Publish inline translation APK

on:
  push:
    branches: [discord-ru-355-10]
    paths: [.github/workflows/publish-inline-apk.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the verified Actions build
        uses: actions/download-artifact@v5
        with:
          name: Discord-RU-355.10-arm64
          run-id: 45791259735
          github-token: ${{ github.token }}
      - name: Publish the APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=discord-ru-355.10-inline
          apk=Discord-RU-355.10-arm64-inline-translation.apk
          sha=a457ba827ce3785e9741f923b2321fafcb1c235dc34c11eeb3628332cc0cd26a
          mv Discord-RU-355.10-arm64.apk "$apk"
          printf '%s  %s\n' "$sha" "$apk" | sha256sum --check
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Discord RU 355.10 для ARM64, Android 7.0 и новее.

          Скачайте файл с расширением `.apk` из раздела Assets и откройте его на телефоне.

          - Кнопка «Перевести» появляется под текстовыми сообщениями. Для первой загрузки языковой модели нужен интернет.
          - Во вкладке «Прокси» поддерживаются SOCKS5, HTTP CONNECT и HTTPS CONNECT.
          - При установке поверх версии с другой подписью Android потребует переустановку.

          [Сборка и проверка подписи в GitHub Actions](https://github.com/dnmo1703/discord-client-auto-translate-/actions/runs/45791259735)
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$apk" \
              --target cb17e9452a906217c01c8beda7c1fb84cb2d9c5d \
              --title 'Discord RU 355.10 · Перевод под сообщениями' \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
          gh api "repos/$GH_REPO/releases/tags/$tag" |
            jq -e --arg name "$apk" --arg digest "sha256:$sha" \
              '.assets[] | select(.name == $name and .state == "uploaded" and .digest == $digest)' >/dev/null
