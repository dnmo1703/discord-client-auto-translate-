name: Publish Discord RU automatic routing

on:
  push:
    branches: [discord-ru-355-10]
    paths: [.github/workflows/publish-auto-apk.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Discord-RU-355.10-arm64
          run-id: 45797579741
          github-token: ${{ github.token }}
      - name: Publish the checked APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=discord-ru-355.10-auto
          apk=Discord-RU-355.10-arm64-auto.apk
          sha=e013ab7bd13ce3c1291250a5f3cea3b8eb8795b581b3a3991926b02889d37ec8
          mv Discord-RU-355.10-arm64.apk "$apk"
          printf '%s  %s\n' "$sha" "$apk" | sha256sum --check
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Тестовый APK Discord RU 355.10 для ARM64, Android 7.0+.

          - Во вкладке «Прокси» включите переключатель и оставьте адрес пустым для автоматического подключения без внешнего прокси. Этот режим может помочь при блокировке DNS или имени сервера. При блокировке IP-адресов нужен внешний прокси.
          - Кнопка «Перевести» работает без настройки. По умолчанию сообщение отправляется в Google Переводчик при нажатии. Языковые модели на телефон не скачиваются.
          - APK подписан тестовым ключом. При конфликте подписи Android потребует переустановить Discord.

          [Сборка и тесты в GitHub Actions](https://github.com/dnmo1703/discord-client-auto-translate-/actions/runs/45797579741)
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$apk" \
              --target 53b26150429afc49a2fac26cbb4a4ce8ad95da9a \
              --title 'Discord RU 355.10 · Автоматическое подключение' \
              --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          fi
          gh api "repos/$GH_REPO/releases/tags/$tag" |
            jq -e --arg name "$apk" --arg digest "sha256:$sha" \
              '.assets[] | select(.name == $name and .state == "uploaded" and .digest == $digest)' >/dev/null
