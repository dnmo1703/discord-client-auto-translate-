name: Publish Discord RU settings APK

on:
  push:
    branches: [discord-ru-355-10]
    paths: [.github/workflows/publish-settings-apk.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Discord-RU-355.10-arm64
          run-id: 45799911635
          github-token: ${{ github.token }}
      - name: Publish the checked APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=discord-ru-355.10-proxy-settings
          apk=Discord-RU-355.10-arm64-proxy-settings.apk
          sha=4e6d656cf7c35e2425f7b8e2480a4477312d02ec0920c618cb9ce53d76b3211e
          mv Discord-RU-355.10-arm64.apk "$apk"
          printf '%s  %s\n' "$sha" "$apk" | sha256sum --check
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Тестовый APK Discord RU 355.10 для ARM64, Android 7.0+.

          - В настройках Discord появился отдельный вход «Прокси».
          - Кнопка «Автоматическое подключение» включает режим без внешнего прокси и сохраняет настройки внешнего сервера. Чтобы вернуться к нему, нажмите «Сохранить» под его параметрами.
          - APK подписан тестовым ключом. При конфликте подписи Android потребует переустановку.

          [Сборка и тесты в GitHub Actions](https://github.com/dnmo1703/discord-client-auto-translate-/actions/runs/45799911635)
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$apk" \
              --target 9c4b6d3dd9b9ac70462fd18208a4c0c8bcc539bb \
              --title 'Discord RU 355.10 · Прокси в настройках' \
              --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          fi
          gh api "repos/$GH_REPO/releases/tags/$tag" |
            jq -e --arg name "$apk" --arg digest "sha256:$sha" \
              '.assets[] | select(.name == $name and .state == "uploaded" and .digest == $digest)' >/dev/null
